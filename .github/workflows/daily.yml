name: Daily Paper Notification

on:
  schedule:
    # 毎日 日本時間 10:00 (UTC 01:00) に実行
    - cron: '0 1 * * *'
  workflow_dispatch: # 手動実行ボタン

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Run paper notificator
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: uv run python main.py --top-n 5

      - name: Create PR for history.json
        id: history-pr
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: history.json
          commit-message: "chore: update history.json"
          branch: auto/update-history
          title: "chore: update history.json"
          body: "送信済み論文の履歴を自動更新します。"
          delete-branch: true

      - name: Auto-merge PR
        if: steps.history-pr.outputs.pull-request-number
        run: gh pr merge ${{ steps.history-pr.outputs.pull-request-number }} --merge --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}

